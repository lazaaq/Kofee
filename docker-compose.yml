services:
  web:
    build: .
    image: kofee:latest
    container_name: kofee
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:8000"
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: kofee.lanasa.web.id,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://kofee.lanasa.web.id
    volumes:
      - ./data:/data
    mem_limit: 512m
